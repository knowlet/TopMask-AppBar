name: Build and release

on:
  push:
    branches: [develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Record checked-out commit
        id: revision
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish a self-contained executable
        shell: pwsh
        run: dotnet publish .\TopMaskAppBar.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output publish

      - name: Package executable and README
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath '.\publish\TopMaskAppBar.exe' -PathType Leaf)) {
            throw 'The published executable is missing.'
          }
          if ((Test-Path -LiteralPath '.\publish\TopMaskAppBar.dll') -or
              (Test-Path -LiteralPath '.\publish\TopMaskAppBar.runtimeconfig.json')) {
            throw 'The publish output is not a single-file application.'
          }
          New-Item -ItemType Directory -Path '.\dist' -Force | Out-Null
          Compress-Archive -LiteralPath '.\publish\TopMaskAppBar.exe', '.\README.md' -DestinationPath '.\dist\TopMask-AppBar-win-x64.zip'

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TopMask-AppBar-win-x64
          path: dist/TopMask-AppBar-win-x64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: TopMask-AppBar-win-x64
          path: release

      - name: Verify tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          encoded_tag=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
          tag_commit=$(gh api "repos/$GH_REPO/commits/$encoded_tag" --jq '.sha')
          if [[ "$tag_commit" != "$BUILT_COMMIT" ]]; then
            echo "The tag no longer points to the commit that was built." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "release/TopMask-AppBar-win-x64.zip" \
            --repo "$GH_REPO" --verify-tag --title "$RELEASE_TAG" --generate-notes
